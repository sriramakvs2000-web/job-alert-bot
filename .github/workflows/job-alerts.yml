name: Job Alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      alert_existing:
        description: "First run only: alert on jobs from the last 24h instead of just saving a baseline"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run job alert bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ALERT_ON_FIRST_RUN: ${{ github.event.inputs.alert_existing }}
        run: python job_alerts.py

      - name: Save seen-jobs state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || (git commit -m "update seen jobs" && git push)
